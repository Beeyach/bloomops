name: Verify zero-to-current migration

# Creates a disposable D1 database named bloomops-a2-zero-verify on the
# authenticated account, proves it reaches the current BloomOps schema from an
# empty database through the repository's own migration paths (schema.sql,
# scripts/migrate.mjs, then the Drizzle migrations under ./drizzle), proves a
# second pass is a no-op, and deletes that database again. The account
# inventory is read before and after and must match.
#
# Nothing here names the committed staging or production databases as a
# target: every migration command runs with a temporary wrangler config whose
# only D1 binding is the disposable database. See
# .github/scripts/verify-zero-remote.mjs for the checks.
#
# Runs on demand and on every push to main so each merged phase/release gets an
# exact-SHA zero-to-current gate automatically.

on:
  workflow_dispatch:
    inputs:
      diagnose_bytecode:
        description: 'Explicitly authorized one-run bytecode diagnostic on the disposable database'
        type: boolean
        default: false
  push:
    branches:
      - main

concurrency:
  group: bloomops-a2-zero-verify
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: "false"

jobs:
  zero-to-current:
    name: Disposable D1 from zero to current schema, twice, then deleted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Test disposable verifier safety and concurrent staging cleanup
        run: node --test tests/zero-verify-safety.test.mjs tests/zero-verifier.test.mjs tests/zero-local-integrity.test.mjs

      - name: Confirm the Cloudflare identity this run acts as
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be repository secrets."
            exit 1
          fi
          npx wrangler whoami

      - name: Create, migrate from zero, migrate again, verify, delete
        env:
          ZERO_VERIFY_SUMMARY_PATH: ${{ runner.temp }}/zero-verify-summary.json
          ZERO_VERIFY_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnose_bytecode && 'true' || 'false' }}
        run: |
          if [ "$ZERO_VERIFY_DIAGNOSTIC" = true ]; then
            node .github/scripts/verify-zero-remote.mjs --diagnose-bytecode
          else
            node .github/scripts/verify-zero-remote.mjs
          fi

      - name: Preserve compact disposable verification outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zero-verify-${{ github.run_id }}
          path: ${{ runner.temp }}/zero-verify-summary.json
          if-no-files-found: warn
          retention-days: 14
