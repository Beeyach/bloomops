# Temporary PERF4 verification workflow. Removed before handoff.
name: PERF4 branch verification

on:
  push:
    branches:
      - perf/perf4-staging-timing-integration

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Syntax and focused PERF4 tests
        run: |
          node --check lib/bloomops/server-timing.mjs
          node --check lib/bloomops/perf4-worker.mjs
          node --check worker.mjs
          node --test tests/server-timing.test.mjs tests/perf4-worker.test.mjs tests/perf4-worker-response.test.mjs

      - name: Full test suite
        run: npm test

      - name: Disposable native D1 projection smokes
        run: |
          node scripts/systems-smoke-local.mjs
          node scripts/projections-smoke-local.mjs

      - name: Next build
        run: npm run build

      - name: OpenNext Cloudflare build
        run: npm run cf:build

      - name: Bundle custom staging Worker without deploying
        run: npx wrangler deploy --dry-run --env staging

      - name: Loopback built-Worker auth and authorization smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run db:schema:local
          npm run db:migrate:local
          npm run db:domain:migrate:local
          npx wrangler dev --port 8787 > /tmp/perf4-wrangler.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/perf4-wrangler.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/perf4-wrangler.log
            exit 1
          fi
          node scripts/auth-smoke-local.mjs --url http://localhost:8787

      - name: Diff hygiene
        run: git diff --check a20dbfc93ad9126b59a91ba7e0442634e2b582a2...HEAD
