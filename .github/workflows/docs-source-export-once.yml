name: Documentation source export (one time)

on:
  push:
    branches: [chore/usage-docs-exact-20260917]
    paths: [.github/workflows/docs-source-export-once.yml]

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'Beeyach/bloomops'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: 7d8166cc317335c01d18fb8596908bcf4562b62d
          persist-credentials: false
      - name: Export tracked source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '7d8166cc317335c01d18fb8596908bcf4562b62d'
          mkdir -p "$RUNNER_TEMP/docs-source-export"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/docs-source-export/source.tar.gz"
          git ls-files --stage -z > "$RUNNER_TEMP/docs-source-export/index.z"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/docs-source-export/identity.txt"
          cd "$RUNNER_TEMP/docs-source-export"
          sha256sum source.tar.gz index.z identity.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-source-export
          path: ${{ runner.temp }}/docs-source-export/
          retention-days: 1
          if-no-files-found: error
