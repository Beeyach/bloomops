# BloomTrack Pro · Cloudflare Pages config.
# This file is used by:
#   • `npx wrangler pages dev` (local preview against the .vercel/output build)
#   • `setupDevPlatform()` in next.config.js (local `next dev`)
#
# The actual production binding is configured in the Cloudflare Pages
# dashboard (Settings → Functions → D1 database bindings). This file
# mirrors that so dev matches prod.
#
# SETUP: create a fresh database and paste its id below, then apply the schema:
#   npx wrangler d1 create bloomtrack-pro
#   npx wrangler d1 execute bloomtrack-pro --file=schema.sql --remote

name = "bloomtrack-pro"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "bloomtrack-pro"
database_id = "412a33ad-860f-45f3-8bb4-3d6749e0d7bf"

# Plain variables have to live here, not in the dashboard. Once a Pages project
# has a wrangler.toml, Cloudflare manages its vars from this file and the
# dashboard will only accept secrets — it says so on the Add dialog, which is
# easy to miss, and a var added there silently never appears.
#
# Neither of these is a credential. RENDER_URL is the audit service, which
# refuses every request that does not carry RENDER_SECRET, and that secret
# stays in the dashboard where it belongs. VIDEO_BASE_URL is the public host
# the finished videos are served from, and it goes out in emails anyway.
[vars]
RENDER_URL = "https://audit-render-vb2hsnq23q-ue.a.run.app"
VIDEO_BASE_URL = "https://file.gobloomwired.com"

# ── Preview deployments ──────────────────────────────────────────────────
#
# Once a Pages project has a wrangler.toml, the top-level config above IS the
# production environment and nothing else inherits from it. A preview build
# with no [env.preview] section therefore has no D1 binding and no vars at
# all — which is why the first preview of the UI branch could not find
# LTB_ACCESS_CODES even though production has it, and would not have found a
# database either once it got past the gate.
#
# Same database on purpose: a preview exists to look at real prospects with
# new UI. Everything it can do, it does for real, which is the trade.
#
# Secrets are NOT declared here and must never be. They are set per
# environment with:
#   npx wrangler pages secret put LTB_ACCESS_CODES --project-name bloomtrack-pro
[env.preview]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "bloomtrack-pro"
database_id = "412a33ad-860f-45f3-8bb4-3d6749e0d7bf"

[env.preview.vars]
RENDER_URL = "https://audit-render-vb2hsnq23q-ue.a.run.app"
VIDEO_BASE_URL = "https://file.gobloomwired.com"
