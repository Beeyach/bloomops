<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual evidence fixture — action visible</title>
<!--
  A deterministic page with one obvious visual truth: a large "Book a call"
  button sits in the first viewport on desktop and on a phone.

  It exists so the visual-evidence pipeline can be proved against something
  whose answer is not in doubt. The load-bearing assertion is that the model
  looking at a screenshot of this page reports the action as visibly present,
  which means the `cta` finding — "nothing above the fold reads like an action" —
  is REFUTED rather than rubber-stamped.

  No forms, no data collection, no login, nothing to submit. The button goes
  nowhere on purpose.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fbf7f9;
    color: #2b1f27;
  }
  header { padding: 28px 24px; border-bottom: 1px solid #e7dbe2; }
  .mark { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 24px 64px; text-align: center; }
  h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.1; margin: 0 0 16px; }
  p.lede { font-size: clamp(16px, 2.4vw, 19px); line-height: 1.55; color: #56454f; margin: 0 auto 32px; max-width: 46ch; }
  .cta {
    display: inline-block;
    background: #d43a65;
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    text-decoration: none;
    padding: 18px 40px;
    border-radius: 8px;
  }
  .note { margin-top: 28px; font-size: 14px; color: #6b5762; }
</style>
</head>
<body>
  <header><span class="mark">Fixture Physio</span></header>
  <main>
    <h1>Sore back? Let's sort it out.</h1>
    <p class="lede">
      Forty-minute assessments with a physiotherapist, in person or over video.
      Same-week appointments most weeks.
    </p>
    <a class="cta" href="#no-op-fixture">Book a call</a>
    <p class="note">
      This page is a test fixture for LeadsThatBloom's visual-evidence checks.
      It is not a real business and the button does nothing.
    </p>
  </main>
</body>
</html>
