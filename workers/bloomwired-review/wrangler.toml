# LEGACY LEADSTHATBLOOM WORKER. NOT PART OF BLOOMOPS. DO NOT DEPLOY.
#
# Kept only because tests pin the drain cadence below and the routing in
# src/index.js. The Worker name and R2 bucket were renamed away from the live
# Leadsthatbloom resources so that a stray `wrangler deploy` from this directory
# cannot reach them (the bucket does not exist, so the deploy is refused).
# Scheduled for removal together with the rest of the prospecting code.

name = "bloomops-legacy-review-do-not-deploy"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "bloomops-legacy-review-bucket-does-not-exist"

# UPLOAD_SECRET is intentionally NOT declared under [vars].
# A plaintext var of the same name collides with the secret and would also
# commit the value to git. Set it once with:
#   wrangler secret put UPLOAD_SECRET

# ── Routing ──────────────────────────────────────────────────────────────
# Custom domain file.gobloomwired.com is attached via the Cloudflare
# dashboard (Workers → bloomwired-review → Settings → Domains & Routes).
# No route config needed here — the custom domain handles it.

# ── Cron ─────────────────────────────────────────────────────────────────
# Cron wakes the queue; the queue does the work. See the scheduled handler in
# src/index.js.
#
#   */5 * * * *   drain approved sends, bounded to 12 jobs / 25s
#   0 4 * * *     the daily bookkeeping: prospect-facts reconcile + tripwire
#
# Five minutes rather than one: a prospect moving through the pipeline in
# twenty minutes instead of four is invisible to a person, and the slower
# cadence keeps a stuck job from being retried twelve times an hour.
[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]

# CRON_SECRET and APP_URL are NOT declared here. The secret is set with
# `wrangler secret put CRON_SECRET` so it never lands in git, and APP_URL
# defaults to the production host inside the handler.
